<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Katamari Amore web port</title>
<link rel="stylesheet" href="ui.css?v=46">
</head>
<body>
<div class="kbox" id="box">
  <!-- logo -->
  <div class="scr" id="sLogo" style="background:#fff">
    <div class="img" style="left:112px;top:32px;width:256px;height:256px;background-image:url(ui/TITLE/TITLE000.png)"></div>
  </div>
  <!-- title -->
  <div class="scr" id="sTitle">
    <div class="img" style="left:0;top:0;width:480px;height:320px;background-image:url(ui/TITLE/TITLE001.png);background-position:-1px 0"></div>
    <div class="img" style="left:-8px;top:2px;width:512px;height:100px;background-image:url(ui/LOGOE/TITLE_L.png)"></div>
    <div class="small" id="tLang" style="right:12px;top:10px;font-size:14px">Language</div>
    <div class="small" id="tStart" style="left:50%;bottom:34px;transform:translateX(-50%);font-size:16px;padding:5px 18px;animation:bl 1.1s infinite">Touch to start</div>
  </div>
  <!-- stage pack select -->
  <div class="scr" id="sPack">
    <div class="img" style="left:0;top:0;width:512px;height:512px;background-image:url(ui/MODE/ModMBG.png)"></div>
    <div class="hdr" id="pkHdr"></div>
    <div id="pkBtns"></div>
  </div>
  <!-- mode select -->
  <div class="scr" id="sMode">
    <div class="img" style="left:0;top:0;width:512px;height:512px;background-image:url(ui/MODE/ModMBG.png)"></div>
    <div class="img" style="left:0;top:214px;width:480px;height:106px;background-image:url(ui/MODE/ModK&R.png);background-position:0 -176px"></div>
    <div class="img" style="left:-14px;top:206px;width:230px;height:113px;background-image:url(ui/MODE/ModK&R.png);background-size:256px 256px;background-position:-1px -142px;transform-origin:0 0;"></div>
    <div class="hdr" id="mHdr"></div>
    <div id="mBtns"></div>
    <div class="small" id="mBack" style="left:12px;bottom:10px">Back</div>
    <div class="info" id="mInfo" style="top:236px;left:200px;right:10px;text-align:left"></div>
  </div>
  <!-- stage select -->
  <div class="scr" id="sStage">
    <div class="img" style="left:0;top:0;width:512px;height:512px;background-image:url(ui/MODE/ModMBG.png)"></div>
    <div class="hdr" id="stHdr"></div>
    <div id="stTiles"></div>
    <div class="small" id="stBack" style="left:12px;bottom:10px">Back</div><div class="small" id="stPack" style="left:70px;bottom:10px">Packs</div><div class="small" id="stRec" style="left:130px;bottom:10px">Records</div><div class="small" id="stAlb" style="left:200px;bottom:10px">Collection</div><div class="small" id="stDemo" style="right:12px;bottom:10px">Replay intro</div>
    <div class="info" id="stInfo" style="bottom:12px;left:80px;right:80px"></div>
  </div>
  <!-- records: the clipboard art from SCORE.dat. Best results per stage and mode, kept in this browser -->
  <div class="scr" id="sRec">
    <div class="img" style="left:0;top:0;width:512px;height:512px;background-image:url(ui/SCORE/ScoSPC2.png)"></div>
    <div class="img" style="left:95px;top:1px;width:290px;height:318px;background-image:url(ui/SCORE/ScoSCORE.png);background-position:-1px -3px"></div>
    <div class="clip" id="rcHdr"></div><div class="clip" id="rcMode" style="cursor:pointer"></div><div class="clip" id="rcRows"></div>
    <div class="small" id="rcBack" style="left:12px;bottom:10px">Back</div><div class="small" id="rcPack" style="right:12px;bottom:10px"></div>
  </div>
  <!-- collection: the album book from ALBUM.dat. The items that were stuck on the ball when a stage was cleared -->
  <div class="scr" id="sAlb">
    <div class="img" style="left:0;top:0;width:512px;height:512px;background-image:url(ui/ALBUM/AlbSPC.png)"></div>
    <div class="img" style="left:0;top:0;width:480px;height:320px;background-image:url(ui/ALBUM/AlbBG1.png)"></div>
    <div class="alb" id="abHdr"></div><div class="alb" id="abList"></div><div class="alb" id="abName"></div><div class="alb" id="abCount"></div><div class="alb" id="abInfo"></div>
    <div class="small" id="abBack" style="left:12px;bottom:10px">Back</div><div class="small" id="abStage" style="right:12px;bottom:10px"></div>
  </div>
  <!-- mission card: the King, then his briefing -->
  <div class="scr" id="sKing">
    <div class="img" style="left:0;top:0;width:512px;height:512px;background-image:url(ui/KING/KinSKING.png)"></div><div class="img kng2" style="left:107px;top:35px;width:256px;height:64px;background-image:url(ui/KING/KinSKNG2.png)"></div>
    <div class="dlg" id="kDlg"><div class="t"></div><div class="n">&#9660;</div></div>
    <div class="small" id="kSkip" style="right:12px;top:10px">Skip</div>
  </div>
  <!-- opening story: the original's intro sprites and script tables, played by intro.js -->
  <div class="scr" id="sDemo" style="background:#000">
    <canvas id="dCv" width="480" height="320" style="position:absolute;left:0;top:0"></canvas>
    <div class="small" id="dSkip" style="right:12px;top:10px">Skip</div>
  </div>
</div>
<script src="load.js?v=46"></script>
<script src="audio.js?v=46"></script>
<script src="text.js?v=46"></script>
<script src="intro.js?v=46"></script>
<script src="menu.js?v=46"></script>
</body>
</html>
