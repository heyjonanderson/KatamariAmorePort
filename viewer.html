<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Katamari Amore web port: viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #101418; color: #dde3ea; font: 13px/1.3 system-ui, sans-serif; overflow: hidden; touch-action: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; left: 8px; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  select, button { background: #1d252e; color: #dde3ea; border: 1px solid #38444f; border-radius: 6px; padding: 6px 10px; font: inherit; }
  button.on { background: #2b5d8a; border-color: #4a8fc9; }
  #info { position: fixed; left: 8px; bottom: 8px; background: #0008; padding: 4px 8px; border-radius: 6px; white-space: pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <select id="stage"></select>
  <button id="bStage" class="on">Stage</button>
  <select id="set" title="placement set"></select>
  <button id="bMap">Map</button>
  <button id="bObj">Objects</button>
  <button id="bColl">Collision</button>
  <button id="bFlip">Flip V</button>
  <button id="bWire">Wire</button>
  <button id="bReset">Reset</button>
</div>
<div id="info">loading</div>
<script src="viewer.js?v=3"></script>
</body>
</html>
